<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rps-game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>

    <div class="flex-container-main">
      <div class="flex-container">
        <button id="btn1" class="btn">Rock</button>
        <button id="btn2" class="btn">Scissors</button>
        <button id="btn3" class="btn">Paper</button>
      </div>

      <div class="flex-container-2">
        <div class="flex-score-card">
          <p>Player Score:</p>
          <p class="player-choice">--</p>
          <p class="player-score">0</p>
        </div>

        <div class="flex-score-card">
          <h2>SCORE-BOARD</h2>
          <p class="outcome">Result</p>
        </div>

        <div class="flex-score-card">
          <p>Computer Score:</p>
          <p class="computer-choice">--</p>
          <p class="computer-score">0</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
